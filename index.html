<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyss Dive</title>
<meta name="theme-color" content="#050a14">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a14;--fg:#cfe8ff;--dim:#5d7a99;--accent:#4fd1c5;--warn:#f6ad55;--bad:#fc8181}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:'VT323',monospace;font-size:22px;transition:background 1s}
main{max-width:560px;margin:0 auto;padding:24px 16px}
h1{font-size:56px;letter-spacing:6px;text-align:center;margin:8px 0 0;color:var(--accent)}
.tag{text-align:center;color:var(--dim);margin-bottom:24px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
button{font:inherit;background:transparent;color:var(--fg);border:2px solid var(--dim);padding:6px 14px;cursor:pointer}
button:hover,button.on{border-color:var(--accent);color:var(--accent)}
.prompt{font-size:34px;text-align:center;margin:16px 0}
.step{color:var(--dim);text-align:center}
form{display:flex;gap:8px}
input{flex:1;font:inherit;background:#0b1626;color:var(--fg);border:2px solid var(--dim);padding:8px;outline:none}
input:focus{border-color:var(--accent)}
.msg{min-height:60px;text-align:center;margin:16px 0}
.depth{font-size:40px;text-align:center}
.log div{display:flex;justify-content:space-between;border-bottom:1px dashed #1c2c44;padding:4px 0}
.ok{color:var(--accent)}.meh{color:var(--warn)}.no{color:var(--bad)}
.hide{display:none}
pre{white-space:pre-wrap;text-align:center}
</style>
</head>
<body>
<main>
<h1>ABYSS DIVE</h1>
<div class="tag">rare answers sink you deeper</div>
<nav>
  <button id="bDaily" class="on">Daily dive</button>
  <button id="bInf">∞ Unlimited</button>
  <button id="bHelp">How to play</button>
</nav>
<section id="help" class="hide">
  <p>Seven prompts. Type one answer each.</p>
  <p>The obvious answers barely count. Rare ones sink you deeper. Answers that aren't on the list score 0m.</p>
  <p>The daily dive is the same for everyone, every day. Unlimited never ends.</p>
</section>
<section id="game">
  <div class="step" id="step"></div>
  <div class="prompt" id="prompt"></div>
  <form id="f"><input id="a" autocomplete="off" placeholder="your answer..." aria-label="Answer"><button>Dive</button></form>
  <div class="msg" id="msg"></div>
  <div class="depth" id="depth">0m</div>
  <div class="log" id="log"></div>
  <pre id="share"></pre>
</section>
</main>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
